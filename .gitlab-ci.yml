
stages:
  - validate
  - build
  - test

validate:
  stage: validate
  image: python:3.12
  script:
    - python --version
    - python -m compileall -q app scripts lambda

build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker compose version
    - docker compose build app

test:
  stage: test
  image: python:3.12
  before_script:
    - pip install -r app/requirements.txt
    - pip install pytest requests
  script:
    - python -m pytest app/test_main.py -v
