
services:
  localstack:
    image: localstack/localstack:4.8.1
    container_name: dr-localstack
    ports:
      - "127.0.0.1:4567:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -fsS http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    container_name: dr-app
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      S3_BUCKET_NAME: cloud-dr-backups
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: dr-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  terraform:
    image: hashicorp/terraform:1.13.3
    container_name: dr-terraform
    working_dir: /workspace
    entrypoint: ["terraform"]
    profiles: ["tools"]
    volumes:
      - ./terraform:/workspace
    depends_on:
      localstack:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.2.0
    container_name: dr-grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus      

volumes:
  localstack_data:
